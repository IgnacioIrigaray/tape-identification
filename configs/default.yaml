# Default configuration for tape parameter identification
# Override any value with CLI args: --key value

# Data jamendo
audio_dir: /mnt/data/working_datasets/jamendo
ext: mp3
# Data guitarset
audio_dir: /mnt/data/working_datasets/guitarset
ext: wav

# input_dirs: ["00", "01"] # optional: subset of subdirs (null = all)
batch_size: 32
num_workers: 0
sample_rate: 22050
audio_length: 65536
train_examples_per_epoch: 5000
val_examples_per_epoch: 500
buffer_size_gb: 3.5
buffer_reload_rate: 2000

# Model
embed_dim: 1024
hidden_dim: 256
degradation_model: ja
regression: true
num_classes: 3
min_param: 1.5
max_param: 5.0

# Training
num_epochs: 400
learning_rate: 5.0e-5
weight_decay: 1.0e-5
device: cuda
patience: 15
min_delta: 0.001
grad_clip_norm: 1.0

# LR scheduler
scheduler_factor: 0.5
scheduler_patience: 5
