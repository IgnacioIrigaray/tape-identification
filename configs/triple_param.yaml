# Triple-parameter experiment: JA drive + WF depth + WF rate
# Usage: python scripts/train.py --config configs/triple_param.yaml --name exp_triple_v1

# Data
audio_dir: /mnt/data/working_datasets/jamendo
# input_dirs: ["00", "01"] # optional: subset of subdirs (null = all)
ext: mp3
batch_size: 32
num_workers: 0
sample_rate: 22050
audio_length: 65536
train_examples_per_epoch: 5000
val_examples_per_epoch: 500
buffer_size_gb: 3.5
buffer_reload_rate: 2000

# Model
embed_dim: 1024
hidden_dim: 256
degradation_model: ja_wf
regression: true
num_classes: 3
min_param: 1.5
max_param: 5.0

# Triple-param ranges
min_depth: 0.1
max_depth: 0.8
min_rate: 0.1
max_rate: 0.8

# Wow/flutter settings
flutter_rate: 0.5
enable_ou: true
wf_interpolation: linear

# Training
num_epochs: 400
learning_rate: 5.0e-5
weight_decay: 1.0e-5
device: cuda
patience: 15
min_delta: 0.001
grad_clip_norm: 1.0

# LR scheduler
scheduler_factor: 0.5
scheduler_patience: 5
