# Configuration for tape noise SNR identification (MagTapeDB)
# The model estimates the SNR (dB) of additive tape noise.

# Clean audio source
audio_dir: /mnt/data/working_datasets/jamendo
ext: mp3
# audio_dir: /mnt/data/working_datasets/guitarset
# ext: wav

# Noise source (MagTapeDB)
noise_dir: /mnt/data/working_datasets/MagTapeDB/tape_noise
noise_ext: wav
noise_train_frac: 0.8 #0.8
noise_preload: true             # load all noise files into RAM at startup
noise_buffer_size_gb: 1         # ignored when noise_preload=true
noise_buffer_reload_rate: 500   # ignored when noise_preload=true

batch_size: 48
num_workers: 1
sample_rate: 22050
audio_length: 65536
train_examples_per_epoch: 5000
val_examples_per_epoch: 500
buffer_size_gb: 5
buffer_reload_rate: 5000

# Model
embed_dim: 1024
hidden_dim: 256
degradation_model: tape_noise
regression: true
num_classes: 5        # used in classification mode only

# SNR range in dB (lower = more noise)
min_param: 0 # 5.0        # heavily degraded tape
max_param: 40 # 30.0       # barely audible hiss

# Headroom: data is sampled from [min_data, max_data] but targets are
# normalized with [min_param, max_param], so predictions never need to
# reach exactly 0 or 1.  Omit or set equal to min/max_param to disable.
min_data: 10.0
max_data: 30.0

# Training
num_epochs: 400
learning_rate: 1.0e-3 #5.0e-5
weight_decay: 1.0e-5
device: cuda
patience: 100
min_delta: 0.001
grad_clip_norm: 1.0

# LR scheduler
scheduler_factor: 0.5
scheduler_patience: 5

# Signal loss (audio reconstruction) — disabled by default for tape_noise
# (DifferentiableForwardModel does not yet support tape_noise)
signal_loss_weight: 0.0
param_loss_weight: 1.0
signal_loss_fft_sizes: [1024, 2048, 8192]
signal_loss_hop_sizes: [256, 512, 2048]
signal_loss_win_lengths: [1024, 2048, 8192]
